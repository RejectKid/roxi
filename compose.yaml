services:
  db:
    image: postgres:17.12-bookworm
    environment:
      POSTGRES_DB: exercise_review
      POSTGRES_USER: review_owner
      POSTGRES_PASSWORD: review-local-owner
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - review_postgres:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "review_owner", "-d", "exercise_review"]
      interval: 3s
      timeout: 3s
      retries: 15

volumes:
  review_postgres:
