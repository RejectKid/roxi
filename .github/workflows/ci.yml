name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
      - name: Install and check dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  demo:
    name: PostgreSQL, HTTP, MCP, and answer-key checks
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      EXERCISE_REVIEW_DATABASE_URL: postgresql://review_owner:review-local-owner@127.0.0.1:55432/exercise_review
      EXERCISE_REVIEW_EDITOR_URL: postgresql://review_editor:review-local-editor@127.0.0.1:55432/exercise_review
      EXERCISE_REVIEW_READER_URL: postgresql://review_reader:review-local-reader@127.0.0.1:55432/exercise_review
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Start disposable PostgreSQL
        run: docker compose up -d --wait db
      - name: Import, publish, and verify the demo
        run: python tools/smoke_demo.py
      - name: Replay sandbox chat and verify worker recovery
        run: python tools/check_live_replay.py
      - name: Verify source catalog ingestion, outages, and replay
        run: python tools/check_source_catalog.py
      - name: Verify cross-source history and map replay
        run: python tools/check_history_view.py
      - name: Verify history assistant, HTTP and MCP parity, and subscription resume
        run: python tools/check_history_interfaces.py
      - name: Verify multi-channel capture, replay, and original audio
        run: python tools/check_live_context.py
      - name: Verify the standalone integration lab and its Roxi HTTP calls
        run: python tools/check_integration_lab.py
      - name: Verify pilot access, retention, and backup restore
        run: |
          docker compose exec -T db createdb -U review_owner roxi_pilot_ci
          docker compose exec -T db createdb -U review_owner roxi_restore_ci
          export EXERCISE_REVIEW_DATABASE_URL=postgresql://review_owner:review-local-owner@127.0.0.1:55432/roxi_pilot_ci
          export EXERCISE_REVIEW_EDITOR_URL=postgresql://review_editor:review-local-editor@127.0.0.1:55432/roxi_pilot_ci
          export EXERCISE_REVIEW_READER_URL=postgresql://review_reader:review-local-reader@127.0.0.1:55432/roxi_pilot_ci
          export ROXI_RESTORE_DATABASE_URL=postgresql://review_owner:review-local-owner@127.0.0.1:55432/roxi_restore_ci
          python tools/check_pilot_operations.py
      - name: Show database logs on failure
        if: failure()
        run: docker compose logs db
      - name: Remove CI database
        if: always()
        run: docker compose down --volumes
