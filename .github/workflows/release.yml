name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish GitHub release
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the tagged changelog
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Use a stable version tag such as v0.1.0."
            exit 1
          fi
          awk -v version="$GITHUB_REF_NAME" '
            $0 == "## " version { section = 1; next }
            section && /^## / { exit }
            section { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md"; then
            echo "::error::Add a changelog section headed ## $GITHUB_REF_NAME before tagging."
            exit 1
          fi
      - name: Publish source release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_url="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,url --jq 'select(.isDraft == false) | .url' 2>/dev/null || true)"
          if [[ -n "$release_url" ]]; then
            echo "Release already published at $release_url"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Roxi $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
